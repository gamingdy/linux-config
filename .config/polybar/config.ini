include-file = colors.ini
include-file = left-module.ini
include-file = center-module.ini
include-file = right-module.ini

[bar/main]
width = 100%
height = 30
offset-y = 0
top = true
fixed-center = true
override-redirect = false
scroll-up = next
scroll-down = prev
enable-ipc = true
background = ${colors.bg}
foreground = ${colors.fg}
border-size = 4
border-color = ${colors.bg}

font-0 = Iosevka Nerd Font:size=12;2
font-1 = Iosevka Nerd Font:size=9;2
font-2 = Product Sans:size=10.2:weight=bold;2
font-3 = Iosevka Nerd Font:size=17;4
font-4 = Product Sans:size=10.2;2
font-5 = "JetBrainsMono Nerd Font:style=Regular:size=10;2"
font-6 = "JetBrainsMono Nerd Font:style=Bold:size=10;2"
font-7 = "JetBrainsMono Nerd Font:size=19;5"

modules-left = launcher workspaces title
modules-center = date
modules-right = filesystem battery cpu ram

tray-position = right
cursor-click = pointer

[bar/external]
modules-right = wlan margin session
inherit = bar/main

[settings]
screenchange-reload = true
format-padding = 1
